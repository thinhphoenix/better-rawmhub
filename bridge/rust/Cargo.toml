[package]
name = "better-rawmhub-bridge"
version = "0.2.1"
edition = "2024"
description = "Loopback WebSocket bridge that gives browsers without WebHID (Firefox, Safari) access to RAWM mice and keyboards"
license = "MIT"

[[bin]]
name = "better-rawmhub-bridge"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tungstenite = "0.30.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
