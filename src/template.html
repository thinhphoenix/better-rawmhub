<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#08090b" />
<link rel="icon" href="assets/rawm-hub.png" />
<title>RAWM HUB — Device configurator</title>
<meta name="description" content="A browser-based configurator for RAWM mice and keyboards. Tune sensitivity, polling, lighting and key mappings without installing a driver." />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>__CSS__</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-mouse" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="5.5"/><path d="M12 2.6v6.2"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h9M17 17h3"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="17" r="2"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2h5c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3Z"/></symbol>
  <symbol id="i-keys" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7 14h10"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11l-1 8.5L19.5 10H13l0-8Z"/></symbol>
  <symbol id="i-chip" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 2v3M14 2v3M10 19v3M14 19v3M2 10h3M2 14h3M19 10h3M19 14h3"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
  <symbol id="i-battery" viewBox="0 0 24 24"><rect x="2" y="8" width="18" height="9" rx="2.5"/><path d="M22 11v3"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.3-2.3a4 4 0 1 0-5.7-5.7L11.5 7"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.3 2.3a4 4 0 1 0 5.7 5.7l1.3-1.3"/></symbol>

  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11"/></symbol>

  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-.6 4M20 4v7h-7"/></symbol>

  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12h3l2.5-6 4 15 3.5-12L18 12h4"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="12.5" rx="2.5"/><path d="M9 21h6M12 16.5V21"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.6 20h18.8L12 3Z"/><path d="M12 9v5M12 17h.01"/></symbol>

  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5 19.5 12 7 19.5v-15Z"/></symbol>
  <symbol id="i-record" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/></symbol>
</svg>

<div class="app">
  <aside class="rail">
    <a class="brand" href="#/device" aria-label="RAWM HUB home">
      <img class="brand-logo" src="assets/rawm-hub.png" alt="RAWM HUB" width="132" height="36" />
    </a>

    <div class="rail-block">
      <p class="rail-label">Configurator</p>
      <nav class="nav" id="nav-main">
        <button class="nav-item" data-page="device"><svg class="ic"><use href="#i-grid"/></svg><span>Device</span></button>
        <button class="nav-item" data-page="buttons"><svg class="ic"><use href="#i-mouse"/></svg><span>Buttons</span></button>
        <button class="nav-item" data-page="performance"><svg class="ic"><use href="#i-sliders"/></svg><span>Performance</span></button>
        <button class="nav-item" data-page="lighting"><svg class="ic"><use href="#i-bulb"/></svg><span>Lighting</span></button>
        <button class="nav-item" data-page="advanced"><svg class="ic"><use href="#i-keys"/></svg><span>Advanced keys</span></button>
        <button class="nav-item" data-page="macros"><svg class="ic"><use href="#i-bolt"/></svg><span>Macros</span></button>
      </nav>
    </div>

    <div class="rail-block">
      <p class="rail-label">System</p>
      <nav class="nav" id="nav-system">
        <button class="nav-item" data-page="firmware"><svg class="ic"><use href="#i-chip"/></svg><span>Firmware</span></button>
        <button class="nav-item" data-page="downloads"><svg class="ic"><use href="#i-download"/></svg><span>Downloads</span></button>
      </nav>
    </div>

    <div class="rail-foot">
      <div id="rail-device" class="rail-device"></div>
      <div class="rail-meta">
        <span>RAWM HUB Web</span>
        <span class="mono">v2.0.0</span>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb">
        <span class="crumb-root">RAWM HUB</span>
        <svg class="ic crumb-sep"><use href="#i-chevron"/></svg>
        <span id="crumb-section">Device</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm topbar-extra" data-action="connect" title="Connect or switch device">
          <svg class="ic"><use href="#i-link"/></svg><span>Connect</span>
        </button>
        <a class="btn btn-ghost btn-sm topbar-extra" href="https://static.miracletek.net/pc/RAWMHUB.zip" target="_blank" rel="noopener" title="Download the desktop app">
          <svg class="ic"><use href="#i-download"/></svg><span>Download app</span>
        </a>
        <select id="fw-channel" class="fw-select" aria-label="Firmware channel">
          <option value="0">FW · STANDARD</option>
          <option value="1">FW · GAMING</option>
        </select>
        <div id="conn-pill" class="conn-pill"></div>
        <button class="btn btn-primary btn-sm" id="apply-btn" data-action="apply" hidden>
          <svg class="ic"><use href="#i-check"/></svg><span>Write to device</span>
        </button>
        <button class="icon-btn" data-action="open-log" title="WebHID console" aria-label="Open WebHID console">
          <svg class="ic"><use href="#i-terminal"/></svg>
        </button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="application/json" id="catalogue">__CATALOGUE__</script>
<script>__ANT_LIB__</script>
<script>__HID__</script>
<script>__APP__</script>
<script>__ANT_CONTROLS__</script>
</body>
</html>
