    <h1>Better RAWM Hub</h1>
    <p>Better RAWM Hub is a free browser-based configurator and alternative to the RAWM HUB desktop software for RAWM mice and keyboards. It configures DPI stages, polling rate, lift-off distance, lighting, button mapping and macros over WebHID in Chrome or Edge.</p>
    <p>Open-source repository and issue tracker: <a href="https://github.com/thinhphoenix/better-rawmhub">github.com/thinhphoenix/better-rawmhub</a>.</p>
    <p>This page needs JavaScript and a Chromium browser with WebHID support.</p>
